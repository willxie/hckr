<!doctype html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Minimal threaded Hacker News discussions, with system-aware dark mode.">
  <meta name="color-scheme" content="dark light">
  <title>Comments · hrnw</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script>
    try {
      const preferences = JSON.parse(localStorage.getItem('hckr-preferences'));
      const theme = preferences?.defaultsVersion === 2 ? localStorage.getItem('hckr-theme') : 'system';
      document.documentElement.dataset.theme = ['dark', 'light', 'system'].includes(theme) ? theme : 'system';
    } catch (_) {}
  </script>
  <link rel="stylesheet" href="styles.css?v=6">
  <script src="comments.js?v=6" type="module"></script>
</head>
<body class="discussion-page">
  <div class="container">
    <header>
      <div class="logo">
        <h1><a href="./">hrnw</a></h1>
        <p>for personal use · inspired by <a href="https://hckrnews.com/">hckrnews.com</a>.</p>
      </div>
      <nav class="mainnav" aria-label="Main navigation">
        <button id="theme-toggle" type="button" aria-label="Switch to light mode" title="Switch to light mode"><svg id="theme-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg><span id="theme-label">light mode</span></button>
        <a href="./">back to news</a>
        <a href="about.html">about</a>
        <a class="extensions" href="about.html#extensions">browser extensions</a>
      </nav>
    </header>
    <main class="discussion-content">
      <section id="discussion-story" aria-label="Story" hidden></section>
      <div class="discussion-toolbar"><a href="./">← news</a><label>theme <select id="theme-select" aria-label="Appearance"><option value="system">system</option><option value="dark">dark</option><option value="light">light</option></select></label><button id="refresh-discussion" type="button" hidden>refresh</button></div>
      <p id="discussion-status" role="status" aria-live="polite">Loading discussion…</p>
      <button id="retry-discussion" type="button" hidden>retry discussion</button>
      <p id="discussion-context" hidden></p>
      <section id="discussion-comments" aria-label="Comments" aria-busy="true"></section>
    </main>
    <footer>inspired by <a href="https://hckrnews.com/">hckrnews.com</a> · powered by <a href="https://news.ycombinator.com/">Hacker News</a></footer>
    <noscript><p>Please enable JavaScript to load this discussion.</p></noscript>
  </div>
</body>
</html>
