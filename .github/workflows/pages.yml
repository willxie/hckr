name: Update news and deploy GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify feed logic
        run: |
          node --test tests/*.test.mjs
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/sanitize_urls.py --check
      - name: Update the feed
        run: |
          python3 scripts/update_feed.py
          python3 scripts/mirror_archive.py --start "$(date -u -d '4 days ago' +%F)"
          python3 scripts/sanitize_urls.py
      - name: Preserve the news archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m 'Update news feed [skip ci]'
            git push
          fi
      - uses: actions/configure-pages@v6.0.0
      - name: Prepare the static site
        run: |
          mkdir -p _site/data
          cp index.html about.html styles.css app.js core.mjs theme.mjs comments.html comments.js comments-api.mjs comment-html.mjs discussion-state.mjs favicon.svg _site/
          cp -R data/. _site/data/
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
